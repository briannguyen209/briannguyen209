<title>Black Cats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap">
<style>
  /* Layout: one comic-book strip, panels stacked in reading order, with a flip-through viewer on top. Single committed look. */
  :root {
    --bg: #1E2340; --paper: #FFF8E7; --ink: #1a1a1a; --yellow: #FFE66D; --red: #FF4B3E; --muted: #C9D2FF;
    --display: 'Bangers', Impact, sans-serif; --text: 'Comic Neue', 'Comic Sans MS', sans-serif;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--paper); font-family: var(--text); }
  .wrap { max-width: 860px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 14vw, 112px); letter-spacing: 4px; line-height: .9; margin: 0; color: var(--paper); text-shadow: 5px 5px 0 var(--red); transform: rotate(-2deg); text-wrap: balance; }
  .by { margin: 0; color: var(--muted); font-size: 18px; }
  .viewer { display: grid; gap: 12px; }
  .viewer img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 8px 8px 0 #000; background: #333; aspect-ratio: 4 / 3; }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  button { font-family: var(--display); font-size: 26px; letter-spacing: 1px; padding: 8px 20px; border: 4px solid var(--ink); background: var(--yellow); color: var(--ink); box-shadow: 4px 4px 0 #000; cursor: pointer; }
  button:hover { background: #FFD23F; }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .count { font-family: var(--display); font-size: 28px; letter-spacing: 2px; color: var(--yellow); font-variant-numeric: tabular-nums; }
  .hint { margin: 0; color: var(--muted); font-size: 15px; text-align: center; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 36px; letter-spacing: 2px; margin: 28px 0 0; color: var(--yellow); }
  .strip { display: grid; gap: 18px; }
  .strip img { width: 100%; height: auto; display: block; box-shadow: 6px 6px 0 #000; aspect-ratio: 4 / 3; }
  @media (prefers-reduced-motion: no-preference) { .viewer img { transition: opacity .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Black Cats</h1>
    <p class="by">A story about Paul, Alex, and a cat that was not as friendly as it looked.</p>
  </header>

  <section class="viewer" aria-label="Flip through the story">
    <img id="current" src="panels/panel-01.png" alt="">
    <div class="controls">
      <button id="prev" type="button" aria-label="Previous picture">◀ Back</button>
      <span class="count" id="count">1 / 19</span>
      <button id="next" type="button" aria-label="Next picture">Next ▶</button>
    </div>
    <p class="hint">Tip: use the arrow keys to turn the page.</p>
  </section>

  <h2>The whole story</h2>
  <div class="strip" id="strip"></div>
</div>

<script>
  const captions = [
    "Paul and Alex love to play outside and talk to animals.",
    "At the fish market they see a black cat.",
    "They try to pet it, and it scratches them.",
    "They tell Mom and Dad what happened.",
    "Their parents say black cats are cursed and bring bad luck.",
    "During lunch, they sneak out to prove their parents wrong.",
    "They search for the cat for three hours.",
    "They see the cat and chase it into the forest.",
    "It gets dark. Paul wants to go home, but Alex runs off.",
    "Paul comes home alone. His parents ask where Alex is.",
    "Paul runs into the dark forest to find her.",
    "He shouts for Alex and finds black cat hairs.",
    "He finds a wolf's footprint.",
    "Alex runs up holding the cat.",
    "In the dark, they hear footsteps.",
    "The wolf catches up and bites Paul's arm.",
    "Alex throws a stone, but the wolf doesn't stop.",
    "They reach the village and the villagers chase the wolf away.",
    "Paul never messes with a black cat again. The end."
  ];
  const src = i => `panels/panel-${String(i + 1).padStart(2, "0")}.png`;
  const img = document.getElementById("current"), count = document.getElementById("count");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  let i = 0;
  function show(n) {
    i = Math.max(0, Math.min(captions.length - 1, n));
    img.src = src(i); img.alt = `Picture ${i + 1}: ${captions[i]}`;
    count.textContent = `${i + 1} / ${captions.length}`;
    prev.disabled = i === 0; next.disabled = i === captions.length - 1;
  }
  prev.onclick = () => show(i - 1); next.onclick = () => show(i + 1);
  img.onclick = () => show(i + 1);
  document.addEventListener("keydown", e => { if (e.key === "ArrowRight") show(i + 1); if (e.key === "ArrowLeft") show(i - 1); });
  const strip = document.getElementById("strip");
  captions.forEach((c, n) => { const im = document.createElement("img"); im.src = src(n); im.alt = `Picture ${n + 1}: ${c}`; im.loading = "lazy"; strip.appendChild(im); });
  show(0);
</script>
